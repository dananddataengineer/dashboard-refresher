name: 1-Hour Dashboard Auto Refresh

on:
  schedule:
    # Runs at 15 minutes past every hour (e.g., 1:15, 2:15, 3:15, 4:15...)
    - cron: '12 * * * *'
  workflow_dispatch: # Allows manual and external webhook triggers

jobs:
  run-auto-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Browser
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Dashboard Refresh Script
        run: python refresh.py
